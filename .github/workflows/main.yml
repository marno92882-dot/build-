name: Telegram Bot - Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL file ZIP (gunakan raw link)'
        required: true
      chat_id:
        description: 'Chat ID Telegram'
        required: true

jobs:
  build:
    name: Build APK dari ZIP
    runs-on: ubuntu-latest

    steps:
      # 1. Cek Owner ID
      - name: Verify Owner ID
        run: |
          OWNER_ID="${{ secrets.OWNER_CHAT_ID }}"
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          
          if [ "$OWNER_ID" != "$CHAT_ID" ]; then
            echo "❌ Unauthorized! Hanya owner yang bisa menggunakan workflow ini."
            exit 1
          fi
          
          echo "✅ Owner verified!"

      # 2. Setup Java
      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Download ZIP dengan penanganan khusus
      - name: Download ZIP
        run: |
          ZIP_URL="${{ github.event.inputs.zip_url }}"
          
          # Convert GitHub blob URL ke raw URL
          if [[ "$ZIP_URL" == *"github.com"* && "$ZIP_URL" == *"/blob/"* ]]; then
            ZIP_URL="${ZIP_URL//\/blob\//\/raw\/}"
            echo "✅ GitHub blob URL diubah ke raw URL: $ZIP_URL"
          fi
          
          echo "📥 Mendownload dari: $ZIP_URL"
          
          # Download dengan curl
          if curl -L --fail --silent --show-error --max-time 300 "$ZIP_URL" -o project.zip; then
            echo "✅ Download berhasil!"
          else
            echo "❌ Download gagal! Pastikan URL adalah direct download link."
            echo "Tips: Untuk GitHub, gunakan 'raw' bukan 'blob'"
            exit 1
          fi
          
          # Cek ukuran file
          FILE_SIZE=$(stat -c%s project.zip 2>/dev/null || stat -f%z project.zip 2>/dev/null)
          echo "📦 Ukuran file: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "❌ File terlalu kecil, kemungkinan bukan ZIP valid!"
            echo "Isi file:"
            head -n 5 project.zip
            exit 1
          fi

      # 5. Extract ZIP
      - name: Extract Project
        run: |
          echo "📂 Mengextract ZIP..."
          
          # Cek tipe file
          FILE_TYPE=$(file project.zip)
          echo "Tipe file: $FILE_TYPE"
          
          if unzip -q project.zip -d flutter_project; then
            echo "✅ Extract berhasil!"
          else
            echo "❌ Gagal extract! File bukan ZIP valid."
            echo "Coba upload ulang file ZIP atau gunakan link raw GitHub."
            exit 1
          fi
          
          echo "📁 Isi folder:"
          ls -la flutter_project/

      # 6. Cari folder project
      - name: Check Project Structure
        run: |
          echo "🔍 Mencari pubspec.yaml..."
          
          PROJECT_DIR=$(find flutter_project -name "pubspec.yaml" -not -path "*/\.*" | head -n 1 | xargs dirname 2>/dev/null)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ pubspec.yaml tidak ditemukan!"
            echo "Isi folder flutter_project:"
            find flutter_project -type f | head -n 20
            exit 1
          fi
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ Project ditemukan di: $PROJECT_DIR"

      # 7. Install Dependencies
      - name: Install Dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "📦 Install dependencies..."
          flutter pub get

      # 8. Build APK
      - name: Build APK Release
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "🔨 Build APK Release..."
          flutter build apk --release

      # 9. Kirim APK ke Telegram
      - name: Send APK to Owner
        run: |
          APK_PATH="${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk"
          OWNER_ID="${{ secrets.OWNER_CHAT_ID }}"
          
          # Kirim pesan
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="$OWNER_ID" \
            -d text="✅ Build APK selesai! Mengirim file..."
          
          # Kirim APK
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="$OWNER_ID" \
            -F document=@"$APK_PATH" \
            -F caption="🎉 APK Release berhasil di-build!"
