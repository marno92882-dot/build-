name: Telegram Bot - Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL file ZIP yang dikirim ke bot Telegram'
        required: true
      chat_id:
        description: 'Chat ID Telegram untuk kirim hasil'
        required: true

jobs:
  build:
    name: Build APK dari ZIP
    runs-on: ubuntu-latest

    steps:
      # 1. Cek Owner ID
      - name: Verify Owner ID
        run: |
          OWNER_ID="${{ secrets.OWNER_CHAT_ID }}"
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          
          if [ "$OWNER_ID" != "$CHAT_ID" ]; then
            echo "❌ Unauthorized! Hanya owner yang bisa menggunakan workflow ini."
            exit 1
          fi
          
          echo "✅ Owner verified!"

      # 2. Setup Java
      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Download ZIP dari URL
      - name: Download ZIP
        run: |
          curl -L "${{ github.event.inputs.zip_url }}" -o project.zip
          ls -la project.zip

      # 5. Extract ZIP
      - name: Extract Project
        run: |
          unzip project.zip -d flutter_project
          ls -la flutter_project/

      # 6. Cari folder project
      - name: Check Project Structure
        run: |
          # Cari folder yang berisi pubspec.yaml
          PROJECT_DIR=$(find flutter_project -name "pubspec.yaml" -not -path "*/\.*" | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project ditemukan di: $PROJECT_DIR"
          ls -la $PROJECT_DIR

      # 7. Install Dependencies
      - name: Install Dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter pub get

      # 8. Build APK
      - name: Build APK Release
        run: |
          cd ${{ env.PROJECT_DIR }}
          flutter build apk --release

      # 9. Kirim APK ke Telegram (hanya ke owner)
      - name: Send APK to Owner
        run: |
          APK_PATH="${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk"
          OWNER_ID="${{ secrets.OWNER_CHAT_ID }}"
          
          # Kirim pesan "Build selesai"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="$OWNER_ID" \
            -d text="✅ Build APK selesai! Mengirim file..."
          
          # Kirim file APK ke owner
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="$OWNER_ID" \
            -F document=@"$APK_PATH" \
            -F caption="🎉 APK Release berhasil di-build!"
