name: Telegram Bot - Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL file ZIP (gunakan raw link)'
        required: true
      chat_id:
        description: 'Chat ID Telegram'
        required: true

jobs:
  build:
    name: Build APK dari ZIP
    runs-on: ubuntu-latest

    steps:
      # 1. Cek Owner ID
      - name: Verify Owner ID
        run: |
          OWNER_ID="${{ secrets.OWNER_CHAT_ID }}"
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          
          if [ "$OWNER_ID" != "$CHAT_ID" ]; then
            echo "❌ Unauthorized! Hanya owner yang bisa menggunakan workflow ini."
            exit 1
          fi
          
          echo "✅ Owner verified!"

      # 2. Setup Java
      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      # 4. Install ImageMagick untuk generate icon
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      # 5. Download ZIP
      - name: Download ZIP
        run: |
          ZIP_URL="${{ github.event.inputs.zip_url }}"
          
          # Convert GitHub blob URL ke raw URL
          if [[ "$ZIP_URL" == *"github.com"* && "$ZIP_URL" == *"/blob/"* ]]; then
            ZIP_URL="${ZIP_URL//\/blob\//\/raw\/}"
            echo "✅ GitHub blob URL diubah ke raw URL"
          fi
          
          echo "📥 Mendownload dari: $ZIP_URL"
          
          if curl -L --fail --silent --show-error --max-time 300 "$ZIP_URL" -o project.zip; then
            echo "✅ Download berhasil!"
          else
            echo "❌ Download gagal!"
            exit 1
          fi

      # 6. Extract ZIP
      - name: Extract Project
        run: |
          echo "📂 Mengextract ZIP..."
          
          if unzip -q project.zip -d flutter_project; then
            echo "✅ Extract berhasil!"
          else
            echo "❌ Gagal extract!"
            exit 1
          fi
          
          ls -la flutter_project/

      # 7. Cari folder project
      - name: Check Project Structure
        run: |
          echo "🔍 Mencari pubspec.yaml..."
          
          PROJECT_DIR=$(find flutter_project -name "pubspec.yaml" -not -path "*/\.*" | head -n 1 | xargs dirname 2>/dev/null)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ pubspec.yaml tidak ditemukan!"
            exit 1
          fi
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ Project ditemukan di: $PROJECT_DIR"
          
          # Cek struktur folder
          echo "📁 Struktur project:"
          ls -la $PROJECT_DIR/
          echo "📁 Folder assets:"
          ls -la $PROJECT_DIR/assets/ 2>/dev/null || echo "Folder assets tidak ditemukan!"
          echo "📁 Folder android:"
          ls -la $PROJECT_DIR/android/ 2>/dev/null || echo "Folder android tidak ditemukan!"

      # 8. Buat gradle.properties jika tidak ada
      - name: Create gradle.properties
        run: |
          cd ${{ env.PROJECT_DIR }}
          
          echo "🔧 Membuat gradle.properties..."
          
          # Pastikan folder android ada
          mkdir -p android
          
          # Buat atau update gradle.properties
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          android.enableJetifier=true
          android.enableR8=true
          EOF
          
          echo "✅ gradle.properties dibuat:"
          cat android/gradle.properties

      # 9. Generate Icon dari logo.png
      - name: Generate Launcher Icons
        run: |
          cd ${{ env.PROJECT_DIR }}
          
          echo "🔧 Generate icon launcher dari logo.png..."
          
          # Cek logo.png
          if [ ! -f "assets/logo.png" ]; then
            echo "❌ assets/logo.png tidak ditemukan!"
            echo "📁 Isi folder assets:"
            ls -la assets/ 2>/dev/null || echo "Folder assets tidak ada!"
            exit 1
          fi
          
          echo "✅ logo.png ditemukan!"
          echo "📏 Ukuran logo.png:"
          identify assets/logo.png 2>/dev/null || file assets/logo.png
          
          # Buat folder mipmap
          MIPMAP_DIRS=(
            "android/app/src/main/res/mipmap-mdpi"
            "android/app/src/main/res/mipmap-hdpi"
            "android/app/src/main/res/mipmap-xhdpi"
            "android/app/src/main/res/mipmap-xxhdpi"
            "android/app/src/main/res/mipmap-xxxhdpi"
          )
          
          # Buat folder jika belum ada
          for dir in "${MIPMAP_DIRS[@]}"; do
            mkdir -p "$dir"
          done
          
          # Generate icon berbagai ukuran
          convert assets/logo.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert assets/logo.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert assets/logo.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert assets/logo.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert assets/logo.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          echo "✅ Icon launcher berhasil dibuat!"
          
          # Verifikasi icon
          for dir in "${MIPMAP_DIRS[@]}"; do
            if [ -f "$dir/ic_launcher.png" ]; then
              echo "✅ $dir/ic_launcher.png ($(identify -format '%wx%h' $dir/ic_launcher.png 2>/dev/null))"
            else
              echo "❌ $dir/ic_launcher.png tidak dibuat!"
            fi
          done

      # 10. Fix AndroidManifest.xml
      - name: Fix AndroidManifest.xml
        run: |
          cd ${{ env.PROJECT_DIR }}
          
          echo "🔧 Mengecek AndroidManifest.xml..."
          
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          if [ ! -f "$MANIFEST" ]; then
            echo "❌ AndroidManifest.xml tidak ditemukan!"
            echo "📁 Struktur folder android:"
            find android -type f | head -n 20
            exit 1
          fi
          
          echo "📄 AndroidManifest.xml sebelum:"
          cat "$MANIFEST"
          
          # Tambahkan icon jika belum ada
          if ! grep -q 'android:icon="@mipmap/ic_launcher"' "$MANIFEST"; then
            # Backup
            cp "$MANIFEST" "${MANIFEST}.backup"
            
            # Tambahkan icon di tag application
            if grep -q '<application' "$MANIFEST"; then
              sed -i 's/<application/<application android:icon="@mipmap\/ic_launcher"/' "$MANIFEST"
              echo "✅ Icon ditambahkan ke AndroidManifest.xml"
            fi
          else
            echo "✅ Icon sudah ada di AndroidManifest.xml"
          fi
          
          echo "📄 AndroidManifest.xml sesudah:"
          cat "$MANIFEST"

      # 11. Update Gradle Configuration
      - name: Update Gradle Configuration
        run: |
          cd ${{ env.PROJECT_DIR }}
          
          echo "🔧 Mengupdate konfigurasi Gradle..."
          
          # Cek gradle-wrapper.properties
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "📦 Mengupdate Gradle wrapper..."
            sed -i 's/gradle-.*-all.zip/gradle-8.3-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
            cat android/gradle/wrapper/gradle-wrapper.properties
          else
            echo "⚠️ gradle-wrapper.properties tidak ditemukan, membuat baru..."
            mkdir -p android/gradle/wrapper
            cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
            distributionBase=GRADLE_USER_HOME
            distributionPath=wrapper/dists
            distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-all.zip
            zipStoreBase=GRADLE_USER_HOME
            zipStorePath=wrapper/dists
            EOF
            echo "✅ gradle-wrapper.properties dibuat"
          fi
          
          # Update build.gradle
          if [ -f "android/app/build.gradle" ]; then
            echo "📦 Mengupdate SDK versions..."
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/' android/app/build.gradle
            sed -i 's/compileSdk = [0-9]*/compileSdk = 34/' android/app/build.gradle
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/' android/app/build.gradle
            sed -i 's/minSdk = [0-9]*/minSdk = 21/' android/app/build.gradle
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/' android/app/build.gradle
            sed -i 's/targetSdk = [0-9]*/targetSdk = 34/' android/app/build.gradle
            echo "✅ SDK versions diupdate"
          fi

      # 12. Install Dependencies
      - name: Install Dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "📦 Flutter version:"
          flutter --version
          
          echo "📦 Install dependencies..."
          flutter pub get

      # 13. Build APK
      - name: Build APK Release
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "🔨 Build APK Release..."
          
          flutter build apk --release

      # 14. Cek hasil build
      - name: Check APK
        run: |
          APK_PATH="${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk"
          
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null)
            echo "✅ APK berhasil dibuat!"
            echo "📦 Ukuran APK: $((APK_SIZE / 1024 / 1024)) MB"
          else
            echo "❌ APK tidak ditemukan!"
            find ${{ env.PROJECT_DIR }}/build -name "*.apk" 2>/dev/null || echo "Tidak ada APK"
            exit 1
          fi

      # 15. Kirim APK ke Telegram
      - name: Send APK to Owner
        run: |
          APK_PATH="${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk"
          OWNER_ID="${{ secrets.OWNER_CHAT_ID }}"
          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null)
          
          echo "📤 Mengirim APK ($((APK_SIZE / 1024 / 1024)) MB) ke Telegram..."
          
          # Kirim pesan status
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="$OWNER_ID" \
            -d text="✅ Build Marno Connect APK selesai!\n📦 Ukuran: $((APK_SIZE / 1024 / 1024)) MB\n📤 Mengirim file..."
          
          # Kirim file APK
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="$OWNER_ID" \
            -F document=@"$APK_PATH" \
            -F caption="🎉 Marno Connect APK Release berhasil di-build!")
          
          # Cek response
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "✅ APK berhasil dikirim ke Telegram!"
          else
            echo "❌ Gagal mengirim APK!"
            echo "Response: $RESPONSE"
            exit 1
          fi

      # 16. Upload sebagai artifact (backup)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: marno-connect-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
