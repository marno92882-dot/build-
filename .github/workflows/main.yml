name: Telegram Bot - Build APK from ZIP
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL file ZIP (raw/direct download link)"
        required: true
        type: string
      chat_id:
        description: "Chat ID Telegram"
        required: true
        type: string

jobs:
  build:
    name: Build APK dari ZIP
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      FLUTTER_VERSION: "3.27.0"
      JAVA_VERSION: "17"

    steps:
      # ============================================================
      # 1. VERIFY OWNER
      # ============================================================
      - name: Verify Owner ID
        shell: bash
        run: |
          set -euo pipefail
          OWNER_ID="${{ secrets.OWNER_CHAT_ID }}"
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          
          if [ -z "$OWNER_ID" ]; then
            echo "❌ Secret OWNER_CHAT_ID belum diset."
            exit 1
          fi
          
          if [ -z "$CHAT_ID" ]; then
            echo "❌ chat_id kosong."
            exit 1
          fi
          
          if [ "$OWNER_ID" != "$CHAT_ID" ]; then
            echo "❌ Unauthorized!"
            exit 1
          fi
          
          echo "✅ Owner verified!"

      # ============================================================
      # 2. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 3. SETUP JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 4. SETUP FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ============================================================
      # 5. INSTALL TOOLS
      # ============================================================
      - name: Install Build Tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip curl file
          echo "✅ Build tools installed."

      # ============================================================
      # 6. DOWNLOAD ZIP
      # ============================================================
      - name: Download ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_URL="${{ github.event.inputs.zip_url }}"
          
          if [ -z "$ZIP_URL" ]; then
            echo "❌ ZIP URL kosong."
            exit 1
          fi
          
          # Convert GitHub blob URL -> raw URL
          if [[ "$ZIP_URL" == *"github.com"* && "$ZIP_URL" == *"/blob/"* ]]; then
            ZIP_URL="${ZIP_URL/\/blob\//\/raw\/}"
          fi
          
          echo "📥 Downloading ZIP..."
          curl \
            --location \
            --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            "$ZIP_URL" \
            --output project.zip
          
          if [ ! -s project.zip ]; then
            echo "❌ project.zip kosong."
            exit 1
          fi
          
          echo "✅ ZIP downloaded."

      # ============================================================
      # 7. EXTRACT ZIP
      # ============================================================
      - name: Extract Project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf flutter_project
          mkdir -p flutter_project
          unzip -q project.zip -d flutter_project
          echo "✅ Extract complete."

      # ============================================================
      # 8. FIND PUBSPEC
      # ============================================================
      - name: Detect Flutter Project
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC="$(find "$GITHUB_WORKSPACE/flutter_project" \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/.dart_tool/*" \
            -not -path "*/build/*" \
            | head -n 1)"
          
          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan."
            exit 1
          fi
          
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "✅ Flutter project: $PROJECT_DIR"

      # ============================================================
      # 9. FIX ANDROID V1 EMBEDDING
      # ============================================================
      - name: Fix Android V1 Embedding
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          
          echo "🔧 Checking Android embedding..."
          
          # Check AndroidManifest.xml for v1 embedding
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml found"
            
            # Check if uses v1 embedding
            if grep -q "io.flutter.app.FlutterApplication" "$MANIFEST"; then
              echo "⚠️ Found v1 embedding, fixing..."
              
              # Replace v1 application class with v2
              sed -i 's/io.flutter.app.FlutterApplication/io.flutter.embedding.android.FlutterApplication/g' "$MANIFEST"
              
              # Remove flutterEmbedding v1 if exists
              sed -i '/android:name="flutterEmbedding"/d' "$MANIFEST"
              
              echo "✅ Manifest fixed"
            else
              echo "✅ Manifest already using v2 embedding"
            fi
          else
            echo "⚠️ AndroidManifest.xml not found"
          fi
          
          # Check MainActivity for v1 embedding
          MAIN_ACTIVITY="android/app/src/main/java"
          if [ -d "$MAIN_ACTIVITY" ]; then
            # Find MainActivity files
            find "$MAIN_ACTIVITY" -name "MainActivity.*" | while read -r file; do
              echo "Checking: $file"
              
              # Fix Java MainActivity
              if [[ "$file" == *.java ]]; then
                if grep -q "io.flutter.app.FlutterActivity" "$file"; then
                  echo "⚠️ Found v1 embedding in Java, fixing..."
                  sed -i 's/io.flutter.app.FlutterActivity/io.flutter.embedding.android.FlutterActivity/g' "$file"
                  echo "✅ Java MainActivity fixed"
                fi
              fi
              
              # Fix Kotlin MainActivity
              if [[ "$file" == *.kt ]]; then
                if grep -q "io.flutter.app.FlutterActivity" "$file"; then
                  echo "⚠️ Found v1 embedding in Kotlin, fixing..."
                  sed -i 's/io.flutter.app.FlutterActivity/io.flutter.embedding.android.FlutterActivity/g' "$file"
                  echo "✅ Kotlin MainActivity fixed"
                fi
              fi
            done
          else
            echo "⚠️ MainActivity directory not found"
          fi
          
          echo "✅ Android embedding check completed."

      # ============================================================
      # 10. CHECK AND FIX MAINACTIVITY
      # ============================================================
      - name: Check MainActivity
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          
          echo "🔍 Searching for MainActivity..."
          find android -name "MainActivity.*" -type f 2>/dev/null || true
          
          # Check if MainActivity exists
          MAIN_ACTIVITY_FILES=$(find android -name "MainActivity.*" -type f 2>/dev/null | wc -l)
          
          if [ "$MAIN_ACTIVITY_FILES" -eq 0 ]; then
            echo "⚠️ MainActivity tidak ditemukan, membuat baru..."
            
            # Determine package name from AndroidManifest
            PACKAGE_NAME=$(grep -o 'package="[^"]*"' android/app/src/main/AndroidManifest.xml | cut -d'"' -f2 || echo "com.example.app")
            
            # Create directory structure
            PACKAGE_PATH="android/app/src/main/java/${PACKAGE_NAME//.//}"
            mkdir -p "$PACKAGE_PATH"
            
            # Create MainActivity.java
            cat > "$PACKAGE_PATH/MainActivity.java" <<'EOF'
            package PACKAGE_NAME_PLACEHOLDER;
            
            import io.flutter.embedding.android.FlutterActivity;
            
            public class MainActivity extends FlutterActivity {
            }
            EOF
            
            # Replace package name
            sed -i "s/PACKAGE_NAME_PLACEHOLDER/$PACKAGE_NAME/g" "$PACKAGE_PATH/MainActivity.java"
            
            echo "✅ MainActivity.java created"
          else
            echo "✅ MainActivity found"
          fi

      # ============================================================
      # 11. FLUTTER PUB GET
      # ============================================================
      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get
          echo "✅ Dependencies installed."

      # ============================================================
      # 12. BUILD APK
      # ============================================================
      - name: Build APK Release
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          echo "=========================================="
          echo "BUILD APK RELEASE"
          echo "=========================================="
          flutter build apk --release
          echo "✅ APK build completed."

      # ============================================================
      # 13. FIND APK
      # ============================================================
      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"
          
          if [ -f "$DEFAULT_APK" ]; then
            APK_PATH="$DEFAULT_APK"
          else
            APK_PATH="$(find "$PROJECT_DIR/build" -type f -name "*.apk" | head -n 1)"
          fi
          
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan."
            exit 1
          fi
          
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_MB=$((APK_SIZE / 1024 / 1024))
          echo "✅ APK found: ${APK_MB} MB"

      # ============================================================
      # 14. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.APK_PATH }}
          retention-days: 14
          if-no-files-found: error

      # ============================================================
      # 15. SEND TELEGRAM MESSAGE
      # ============================================================
      - name: Send Build Result to Telegram
        shell: bash
        run: |
          set -euo pipefail
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          OWNER_ID="${{ secrets.OWNER_CHAT_ID }}"
          
          if [ -z "$BOT_TOKEN" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN belum diset."
            exit 1
          fi
          
          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_MB=$((APK_SIZE / 1024 / 1024))
          
          curl \
            --fail \
            --silent \
            --show-error \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "text=✅ Build APK selesai!%0A📦 Ukuran: ${APK_MB} MB"
          
          echo "✅ Telegram message sent."

      # ============================================================
      # 16. SEND APK TO TELEGRAM
      # ============================================================
      - name: Send APK to Telegram
        shell: bash
        run: |
          set -euo pipefail
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          OWNER_ID="${{ secrets.OWNER_CHAT_ID }}"
          
          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "❌ Telegram credentials belum diset."
            exit 1
          fi
          
          echo "📤 Sending APK..."
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${OWNER_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=🎉 APK Release"
          
          echo "✅ APK sent to Telegram."
