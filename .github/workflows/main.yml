name: Telegram Bot - Build APK from ZIP
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL file ZIP (raw/direct download link)"
        required: true
        type: string
      chat_id:
        description: "Chat ID Telegram"
        required: true
        type: string

jobs:
  build:
    name: Build APK dari ZIP
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read

    env:
      FLUTTER_VERSION: "3.27.0"

    steps:
      # ============================================================
      # 1. VERIFY OWNER
      # ============================================================
      - name: Verify Owner ID
        shell: bash
        run: |
          set -euo pipefail
          OWNER_ID="${{ secrets.OWNER_CHAT_ID }}"
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          
          if [ -z "$OWNER_ID" ]; then
            echo "❌ Secret OWNER_CHAT_ID belum diset."
            exit 1
          fi
          
          if [ -z "$CHAT_ID" ]; then
            echo "❌ chat_id kosong."
            exit 1
          fi
          
          if [ "$OWNER_ID" != "$CHAT_ID" ]; then
            echo "❌ Unauthorized!"
            exit 1
          fi
          
          echo "✅ Owner verified!"

      # ============================================================
      # 2. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 3. SETUP JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 4. SETUP FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ============================================================
      # 5. INSTALL TOOLS
      # ============================================================
      - name: Install Build Tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip curl file
          echo "✅ Build tools installed."

      # ============================================================
      # 6. DOWNLOAD ZIP
      # ============================================================
      - name: Download ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_URL="${{ github.event.inputs.zip_url }}"
          
          if [ -z "$ZIP_URL" ]; then
            echo "❌ ZIP URL kosong."
            exit 1
          fi
          
          # Convert GitHub blob URL -> raw URL
          if [[ "$ZIP_URL" == *"github.com"* && "$ZIP_URL" == *"/blob/"* ]]; then
            ZIP_URL="${ZIP_URL/\/blob\//\/raw\/}"
          fi
          
          echo "📥 Downloading ZIP..."
          curl \
            --location \
            --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            "$ZIP_URL" \
            --output project.zip
          
          if [ ! -s project.zip ]; then
            echo "❌ project.zip kosong."
            exit 1
          fi
          
          echo "✅ ZIP downloaded."

      # ============================================================
      # 7. EXTRACT ZIP
      # ============================================================
      - name: Extract Project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf flutter_project
          mkdir -p flutter_project
          unzip -q project.zip -d flutter_project
          echo "✅ Extract complete."

      # ============================================================
      # 8. FIND PUBSPEC
      # ============================================================
      - name: Detect Flutter Project
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC="$(find "$GITHUB_WORKSPACE/flutter_project" \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/.dart_tool/*" \
            -not -path "*/build/*" \
            | head -n 1)"
          
          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan."
            exit 1
          fi
          
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "✅ Flutter project: $PROJECT_DIR"

      # ============================================================
      # 9. FLUTTER PUB GET
      # ============================================================
      - name: Flutter Pub Get
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get
          echo "✅ Dependencies installed."

      # ============================================================
      # 10. BUILD APK (dengan verbose)
      # ============================================================
      - name: Build APK Release
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          echo "=========================================="
          echo "BUILD APK RELEASE"
          echo "=========================================="
          echo "Current directory: $(pwd)"
          echo "Flutter version: $(flutter --version)"
          echo "=========================================="
          
          # Build dengan verbose dan output ke file
          flutter build apk --release --verbose 2>&1 | tee build.log
          
          # Check build result
          if [ $? -ne 0 ]; then
            echo "❌ Build failed."
            echo "Last 50 lines of build log:"
            tail -50 build.log
            exit 1
          fi
          
          echo "✅ APK build completed."
          
          # Show APK files
          echo "APK files:"
          find build -name "*.apk" -type f -exec ls -lh {} \;

      # ============================================================
      # 11. FIND APK
      # ============================================================
      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          
          DEFAULT_APK="build/app/outputs/flutter-apk/app-release.apk"
          
          if [ -f "$DEFAULT_APK" ]; then
            APK_PATH="$DEFAULT_APK"
          else
            APK_PATH="$(find build -type f -name "*.apk" | head -n 1)"
          fi
          
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ APK tidak ditemukan."
            echo "Mencari semua file .apk..."
            find . -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi
          
          # Convert to absolute path
          APK_PATH="$(realpath "$APK_PATH")"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          
          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_MB=$((APK_SIZE / 1024 / 1024))
          echo "✅ APK found: $APK_PATH"
          echo "📦 Size: ${APK_MB} MB"

      # ============================================================
      # 12. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.APK_PATH }}
          retention-days: 14
          if-no-files-found: error

      # ============================================================
      # 13. SEND TELEGRAM MESSAGE
      # ============================================================
      - name: Send Build Result to Telegram
        shell: bash
        run: |
          set -euo pipefail
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          OWNER_ID="${{ secrets.OWNER_CHAT_ID }}"
          
          if [ -z "$BOT_TOKEN" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN belum diset."
            exit 1
          fi
          
          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_MB=$((APK_SIZE / 1024 / 1024))
          
          curl \
            --fail \
            --silent \
            --show-error \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OWNER_ID}" \
            --data-urlencode "text=✅ Build APK selesai!%0A📦 Ukuran: ${APK_MB} MB"
          
          echo "✅ Telegram message sent."

      # ============================================================
      # 14. SEND APK TO TELEGRAM
      # ============================================================
      - name: Send APK to Telegram
        shell: bash
        run: |
          set -euo pipefail
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          OWNER_ID="${{ secrets.OWNER_CHAT_ID }}"
          
          if [ -z "$BOT_TOKEN" ] || [ -z "$OWNER_ID" ]; then
            echo "❌ Telegram credentials belum diset."
            exit 1
          fi
          
          echo "📤 Sending APK..."
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${OWNER_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=🎉 APK Release"
          
          echo "✅ APK sent to Telegram."
