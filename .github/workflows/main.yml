name: Telegram Bot - Build APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL file ZIP (gunakan raw link)'
        required: true
      chat_id:
        description: 'Chat ID Telegram'
        required: true

jobs:
  build:
    name: Build APK dari ZIP
    runs-on: ubuntu-latest

    steps:
      # 1. Cek Owner ID
      - name: Verify Owner ID
        run: |
          OWNER_ID="${{ secrets.OWNER_CHAT_ID }}"
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          
          if [ "$OWNER_ID" != "$CHAT_ID" ]; then
            echo "❌ Unauthorized! Hanya owner yang bisa menggunakan workflow ini."
            exit 1
          fi
          
          echo "✅ Owner verified!"

      # 2. Setup Java
      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Setup Flutter (versi yang kompatibel dengan Dart 3.0)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'  # Stabil untuk Dart 3.0
          channel: 'stable'
          cache: true

      # 4. Download ZIP
      - name: Download ZIP
        run: |
          ZIP_URL="${{ github.event.inputs.zip_url }}"
          
          # Convert GitHub blob URL ke raw URL
          if [[ "$ZIP_URL" == *"github.com"* && "$ZIP_URL" == *"/blob/"* ]]; then
            ZIP_URL="${ZIP_URL//\/blob\//\/raw\/}"
            echo "✅ GitHub blob URL diubah ke raw URL"
          fi
          
          echo "📥 Mendownload dari: $ZIP_URL"
          
          if curl -L --fail --silent --show-error --max-time 300 "$ZIP_URL" -o project.zip; then
            echo "✅ Download berhasil!"
          else
            echo "❌ Download gagal!"
            exit 1
          fi

      # 5. Extract ZIP
      - name: Extract Project
        run: |
          echo "📂 Mengextract ZIP..."
          
          if unzip -q project.zip -d flutter_project; then
            echo "✅ Extract berhasil!"
          else
            echo "❌ Gagal extract!"
            exit 1
          fi
          
          ls -la flutter_project/

      # 6. Cari folder project
      - name: Check Project Structure
        run: |
          echo "🔍 Mencari pubspec.yaml..."
          
          PROJECT_DIR=$(find flutter_project -name "pubspec.yaml" -not -path "*/\.*" | head -n 1 | xargs dirname 2>/dev/null)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ pubspec.yaml tidak ditemukan!"
            exit 1
          fi
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "✅ Project ditemukan di: $PROJECT_DIR"
          
          # Tampilkan info project
          cd $PROJECT_DIR
          echo "📱 Nama project: $(grep '^name:' pubspec.yaml | cut -d' ' -f2)"
          echo "📱 Deskripsi: $(grep '^description:' pubspec.yaml | cut -d' ' -f2-)"

      # 7. Update Gradle untuk kompatibilitas
      - name: Update Gradle Configuration
        run: |
          cd ${{ env.PROJECT_DIR }}
          
          # Update Gradle wrapper ke versi yang kompatibel
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "📦 Mengupdate Gradle wrapper..."
            sed -i 's/gradle-.*-all.zip/gradle-8.3-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
            cat android/gradle/wrapper/gradle-wrapper.properties
          fi
          
          # Update Kotlin versi jika perlu
          if [ -f "android/build.gradle" ]; then
            echo "📦 Mengecek build.gradle..."
            cat android/build.gradle | grep -E "kotlin|gradle" || true
          fi

      # 8. Install Dependencies
      - name: Install Dependencies
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "📦 Flutter version:"
          flutter --version
          
          echo "📦 Install dependencies..."
          flutter pub get

      # 9. Build APK
      - name: Build APK Release
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "🔨 Build APK Release..."
          
          flutter build apk --release

      # 10. Cek hasil build
      - name: Check APK
        run: |
          APK_PATH="${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk"
          
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null)
            echo "✅ APK berhasil dibuat!"
            echo "📦 Ukuran APK: $((APK_SIZE / 1024 / 1024)) MB"
          else
            echo "❌ APK tidak ditemukan!"
            find ${{ env.PROJECT_DIR }}/build -name "*.apk" 2>/dev/null || echo "Tidak ada APK"
            exit 1
          fi

      # 11. Kirim APK ke Telegram
      - name: Send APK to Owner
        run: |
          APK_PATH="${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk"
          OWNER_ID="${{ secrets.OWNER_CHAT_ID }}"
          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null)
          
          echo "📤 Mengirim APK ($((APK_SIZE / 1024 / 1024)) MB) ke Telegram..."
          
          # Kirim pesan status
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="$OWNER_ID" \
            -d text="✅ Build APK selesai!\n📦 Ukuran: $((APK_SIZE / 1024 / 1024)) MB\n📤 Mengirim file..."
          
          # Kirim file APK
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="$OWNER_ID" \
            -F document=@"$APK_PATH" \
            -F caption="🎉 Marno Connect APK Release berhasil di-build!")
          
          # Cek response
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "✅ APK berhasil dikirim ke Telegram!"
          else
            echo "❌ Gagal mengirim APK!"
            echo "Response: $RESPONSE"
            exit 1
          fi

      # 12. Upload sebagai artifact (backup)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: marno-connect-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
